name: Portfolio example
on: { workflow_dispatch: {} }
permissions: { contents: read }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          repository: ${{ vars.QUALITY_SUMMARY_REPOSITORY }}
          ref: quality-summaries
          path: summaries
          token: ${{ secrets.QUALITY_SUMMARY_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/checkout@v5
        with: { path: tool, persist-credentials: false }
      - run: cd tool && npm ci && npm run build
      - run: node tool/packages/report-cli/dist/index.js portfolio --input summaries/projects --output portfolio --stale-days 7
      - uses: actions/upload-pages-artifact@v5
        with: { path: portfolio }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions: { pages: write, id-token: write }
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
