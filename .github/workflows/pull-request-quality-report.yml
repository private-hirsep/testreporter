name: Pull request quality report

on:
  pull_request:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prepare reporter directories and Playwright
        run: bash scripts/prepare-quality-runner.sh
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - name: Unit tests and coverage
        run: npm test -- --coverage --coverage.reporter=json-summary --reporter=default --reporter=json --outputFile.json=quality-artifacts/tests/unit/vitest.json
      - name: E2E tests
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: quality-artifacts/tests/e2e/playwright.xml
        run: npm run test:e2e -- --reporter=line,junit
      - name: Collect coverage
        run: cp coverage/coverage-summary.json quality-artifacts/coverage/coverage-summary.json
      - name: Generate read-only pull-request report
        run: >
          npm run quality-report -- generate
          --config quality-report.yml
          --input quality-artifacts
          --output site
          --execution-id "pr-${{ github.event.pull_request.number }}-${{ github.run_id }}-${{ github.run_attempt }}"
          --workflow-run "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          --commit-sha "${{ github.event.pull_request.head.sha }}"
          --branch "${{ github.head_ref }}"
          --publish-mode artifact
          --no-fail-on-quality-gate
          --zip
      - name: Upload pull-request report (not retained history)
        uses: actions/upload-artifact@v4
        with:
          name: testreporter-pr-${{ github.event.pull_request.number }}-report
          path: site
          if-no-files-found: error
