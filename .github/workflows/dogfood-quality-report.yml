name: Trusted self quality report

on:
  push:
    branches: [main, "release/**"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testreporter-quality-history
  cancel-in-progress: false

jobs:
  build-and-report:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prepare reporter directories and Playwright
        run: bash scripts/prepare-quality-runner.sh
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - name: Unit tests and coverage
        run: npm test -- --coverage --coverage.reporter=json-summary --reporter=default --reporter=json --outputFile.json=quality-artifacts/tests/unit/vitest.json
      - name: E2E tests
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: quality-artifacts/tests/e2e/playwright.xml
        run: npm run test:e2e -- --reporter=line,junit
      - name: Collect coverage
        run: cp coverage/coverage-summary.json quality-artifacts/coverage/coverage-summary.json
      - name: Generate current report
        run: >
          npm run quality-report -- generate
          --config quality-report.yml
          --input quality-artifacts
          --output site
          --execution-id "${{ github.run_id }}-${{ github.run_attempt }}"
          --workflow-run "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}"
          --commit-sha "${{ github.sha }}"
          --branch "${{ github.ref_name }}"
          --no-fail-on-quality-gate
      - uses: actions/upload-artifact@v4
        with:
          name: testreporter-current-report
          path: site
          if-no-files-found: error

  persist-history:
    needs: build-and-report
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: testreporter-current-report
          path: site
      - uses: actions/checkout@v4
        with:
          path: tool
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tool/package-lock.json
      - working-directory: tool
        run: npm ci && npm run build
      - name: Merge, persist, verify, and finalize history
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tool/scripts/persist-history.sh site/normalized-report.json site tool tool/quality-report.yml
      - name: Verify finalized Pages history
        run: test -f site/data/history.json
      - uses: actions/upload-artifact@v4
        with:
          name: testreporter-final-report
          path: site
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy-pages:
    needs: persist-history
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
