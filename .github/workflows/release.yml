name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prepare reporter directories and Playwright
        run: bash scripts/prepare-quality-runner.sh
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run test:e2e
      - name: Verify release-candidate version
        run: test "$(node packages/report-cli/dist/index.js --version)" = "1.0.0-rc.1"
      - name: Pack release packages and run clean-install smoke test
        run: npm run release:smoke
      - name: Generate release checksums
        shell: bash
        run: |
          cd dist/release
          sha256sum *.tgz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: testreporter-v1.0.0-rc.1
          path: |
            dist/release/*.tgz
            dist/release/SHA256SUMS
          if-no-files-found: error
